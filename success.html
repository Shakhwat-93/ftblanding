<!DOCTYPE html>
<html lang="bn">
<head>

    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-N3RQSVF7');</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed | Family Travel Bag</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background-color: #f7f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: var(--font-bn);
            background-image: radial-gradient(circle at top right, rgba(230, 57, 70, 0.05), transparent 400px), 
                              radial-gradient(circle at bottom left, rgba(43, 58, 140, 0.05), transparent 400px);
        }
        .success-card {
            background: #fff;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 1px solid rgba(0,0,0,0.05);
            position: relative;
            overflow: hidden;
        }
        .success-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, var(--primary), #2b3a8c);
        }
        .success-icon {
            width: 80px;
            height: 80px;
            background: #e8f7f0;
            color: #2A9D8F;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 30px;
            animation: scaleIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .success-card h1 {
            font-family: var(--font-en);
            font-size: 2.2rem;
            color: var(--text-dark);
            margin-bottom: 15px;
        }
        .success-card p {
            color: #555;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .order-id-box {
            background: #f8f9fa;
            border: 1px dashed #ced4da;
            padding: 15px 25px;
            border-radius: 10px;
            font-family: var(--font-en);
            font-weight: 700;
            color: var(--primary);
            font-size: 1.2rem;
            margin-bottom: 35px;
            letter-spacing: 1px;
            display: inline-block;
        }
        .btn-home {
            display: inline-block;
            background: var(--primary);
            color: #fff;
            text-decoration: none;
            padding: 15px 35px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(230, 57, 70, 0.2);
            font-family: var(--font-bn);
        }
        .btn-home:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(230, 57, 70, 0.3);
            background: #d62828;
            color: #fff;
        }
        @keyframes scaleIn {
            0% { transform: scale(0) rotate(-15deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N3RQSVF7"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <div class="success-card">
        <div class="success-icon">✓</div>
        <h1>Order Confirmed!</h1>
        <p>আপনাকে অসংখ্য ধন্যবাদ! আপনার অর্ডারটি সফলভাবে গ্রহণ করা হয়েছে। আমাদের একজন প্রতিনিধি দ্রুত আপনার সাথে যোগাযোগ করে অর্ডারটি কনফার্ম করবেন।</p>
        
        <div class="order-id-box" id="order-id-display">
            Loading...
        </div>

        <div>
            <a href="index.html" class="btn-home">← হোমপেজে ফিরে যান</a>
        </div>
    </div>

    <script>
        // Extract order_id from URL
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('order_id');
        
        if (orderId) {
            document.getElementById('order-id-display').innerHTML = `<span style="color:#6c757d; font-size:0.9rem; display:block; margin-bottom:5px;">Your Order ID</span>${orderId}`;
            
            // Handle DataLayer Push for Purchase Event
            try {
                const orderDataStr = localStorage.getItem('latest_order');
                if (orderDataStr) {
                    const orderData = JSON.parse(orderDataStr);
                    
                    // Only push if the ID matches to prevent duplicate fires on reload of different IDs
                    if (orderData.id === orderId) {
                        window.dataLayer = window.dataLayer || [];
                        window.dataLayer.push({ ecommerce: null }); // Clear previous
                        
                        // Format items for GA4 standard
                        const gtmItems = orderData.ordered_items.map((item, index) => ({
                            item_name: item.name,
                            price: item.price,
                            quantity: item.quantity,
                            index: index
                        }));

                        window.dataLayer.push({
                            event: 'purchase',
                            ecommerce: {
                                transaction_id: orderData.id,
                                value: orderData.amount,
                                currency: 'BDT',
                                shipping: orderData.shipping_zone === 'Inside dhaka' ? 60 : 130,
                                items: gtmItems
                            },
                            customer: {
                                name: orderData.customer_name,
                                phone: orderData.phone,
                                address: orderData.address,
                                zone: orderData.shipping_zone
                            }
                        });

                        console.log("GTM Purchase Event Fired:", orderData.id);
                        
                        // Clear the data so it doesn't fire again on page refresh
                        localStorage.removeItem('latest_order');
                    }
                }
            } catch (e) {
                console.error("Error pushing to dataLayer", e);
            }

        } else {
            document.getElementById('order-id-display').style.display = 'none';
        }
    </script>
</body>
</html>
